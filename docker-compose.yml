# Vector databases (and Ollama) for the Euro 2024 RAG demo. Start only what VectorStore:Provider / Ai:Provider point at, e.g.
#   docker compose up -d qdrant
# Data is kept in named volumes; `docker compose down -v` wipes it.
services:
  pgvector:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: euro2024
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      # The image ships the extension but doesn't enable it; this runs once, on an empty data volume.
      - ./docker/pgvector-init.sql:/docker-entrypoint-initdb.d/pgvector-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d euro2024"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333" # REST + dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC, used by the .NET client
    volumes:
      - qdrant-data:/qdrant/storage

  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data

  # Local LLMs for Ai:Provider=Ollama. On macOS a native install (https://ollama.com/download) uses the GPU and is
  # much faster; Docker Desktop on Mac runs it on the CPU. Pull the models once:
  #   docker compose exec ollama ollama pull gemma3:4b
  #   docker compose exec ollama ollama pull embeddinggemma
  ollama:
    image: ollama/ollama:0.40.0
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
  pgvector-data:
  qdrant-data:
  chroma-data:
