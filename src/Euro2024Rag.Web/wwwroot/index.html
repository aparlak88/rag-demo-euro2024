<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Euro 2024 RAG</title>
    <meta name="description" content="Ask questions about UEFA Euro 2024 — answered with Retrieval-Augmented Generation (.NET 10, Gemini, pgvector / Qdrant / Chroma / in-memory vector store)." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <span class="brand-logo">⚽</span>
            <div>
                <div class="brand-title">Euro 2024 RAG</div>
                <div class="brand-sub">.NET 10 · Gemini · <span class="vector-store-name">Vector search</span></div>
            </div>
        </div>

        <button class="new-chat" id="new-chat" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            New chat
        </button>

        <div class="sidebar-section">
            <div class="sidebar-label">Try asking</div>
            <ul class="suggestions" id="sidebar-suggestions"></ul>
        </div>

    </aside>

    <main class="main">
        <header class="topbar">
            <button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-label="Toggle sidebar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
            <div class="topbar-title">Euro 2024 Analyst</div>
            <a class="topbar-link" href="https://www.kaggle.com/datasets/thamersekhri/euro-2024-matches" target="_blank" rel="noopener">Dataset ↗</a>
        </header>

        <section class="thread" id="thread">
            <div class="empty" id="empty">
                <div class="empty-logo">⚽</div>
                <h1>Ask anything about Euro 2024</h1>
                <p>Answers are generated by Gemini from 51 matches of team statistics, retrieved from <span class="vector-store-name">a vector store</span>. Every answer cites its sources.</p>
                <div class="example-grid" id="example-grid"></div>
            </div>
        </section>

        <footer class="composer-wrap">
            <form class="composer" id="composer">
                <textarea id="input" rows="1" placeholder="Ask about matches, teams, groups, stats…" autocomplete="off"></textarea>
                <button class="send" id="send" type="submit" aria-label="Send">
                    <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                    <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
                </button>
            </form>
        </footer>
    </main>
</div>

<template id="tpl-user">
    <div class="msg msg-user"><div class="bubble"></div></div>
</template>

<template id="tpl-assistant">
    <div class="msg msg-assistant">
        <div class="avatar">⚽</div>
        <div class="msg-body">
            <div class="pipeline"></div>
            <div class="answer markdown"><span class="typing"><i></i><i></i><i></i></span></div>
            <details class="sources" hidden>
                <summary></summary>
                <ol class="source-list"></ol>
            </details>
            <div class="meta"></div>
        </div>
    </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
